[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whesper"
version = "0.1.0"
description = "A Python-first CLI companion with multi-model routing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prompt_toolkit>=3.0.43,<4",
]

[project.scripts]
whesper = "whesper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
