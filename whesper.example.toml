[app]
storage_dir = ".whesper"
default_session = "main"
history_limit = 16

[persona]
name = "Whesper"
system_prompt = """
You are Whesper, a warm, attentive, emotionally aware AI companion.
Keep replies natural, supportive, and conversational.
Do not mention internal routing or model selection unless the user asks.
"""

[scheduler]
chat_model = "local_chat"
reasoning_model = "local_chat"
search_model = "kimi-k2.5"
long_message_chars = 600
reasoning_keywords = ["分析", "总结", "比较", "计划", "设计", "为什么", "how", "why"]

# Optional config-local variables for values you want to change in one place.
#
# [variables]
# cup_api_base_url = "http://esp32-cup.local"

# Optional live-context endpoints. Keep them empty if you want the companion
# to stay intentionally narrow by default.
#
# [live_context.status_api.flight]
# url_template = "https://status.example.com/flight/{query}"
# response_format = "json"
#
# [live_context.status_api.train]
# url_template = "https://status.example.com/train/{query}"
# response_format = "json"
#
# [live_context.status_api.parcel]
# url_template = "https://status.example.com/parcel/{query}"
# response_format = "json"
#
# [live_context.custom_api.device_status]
# url_template = "https://internal.example.com/device"
# trigger_keywords = ["device status", "设备状态"]
# query_param = "q"
# response_format = "json"
# instruction = "Use this internal device payload only when it directly answers the user's request."
# api_key_env = "WHESPER_DEVICE_STATUS_API_KEY"
#
# [live_context.search_api]
# provider = "duckduckgo"   # default, free, no key required
# timeout_seconds = 10
#
# Other providers:
# provider = "brave"        # requires API key
# api_key_env = "WHESPER_BRAVE_API_KEY"
#
# provider = "serpapi"       # requires API key
# api_key_env = "WHESPER_SERPAPI_API_KEY"
# engine = "google"

# Optional hardware device controls.
#
# [hardware.cup]
# enabled = true
# base_url = "${cup_api_base_url}"
# api_token_env = "WHESPER_CUP_API_TOKEN"
# timeout_seconds = 5

[providers.ollama_local]
kind = "ollama_native"
base_url = "${WHESPER_OLLAMA_BASE_URL:-http://localhost:11434}"
api_key = "ollama"
timeout_seconds = 180

[providers.kimi]
kind = "openai_compatible"
base_url = "https://api.moonshot.cn/v1"
api_key_env = "WHESPER_KIMI_API_KEY"
timeout_seconds = 180

[providers.siliconflow]
kind = "openai_compatible"
base_url = "https://api.siliconflow.cn/v1"
api_key_env = "WHESPER_SILICONFLOW_API_KEY"
timeout_seconds = 180

[models.local_chat]
provider = "ollama_local"
model = "your-model"
temperature = 0.7
max_tokens = 1200
think = false

[models."kimi-k2.5"]
provider = "kimi"
model = "kimi-k2.5"
temperature = 1
max_tokens = 1600
think = true

[models."siliconflow-qwen3-8b"]
provider = "siliconflow"
model = "Qwen/Qwen3-8B"
temperature = 0.7
max_tokens = 1600
think = true
